[project]
name = "kasbench-runner"
version = "0.1.0"
description = "KASBench Benchmark Runner - FastAPI microservice for orchestrating benchmark trials"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "asyncssh>=2.21",
    "httpx>=0.27",
    "boto3>=1.37",
    "kr8s>=0.19",
    "structlog>=25.1",
    "pydantic-settings>=2.14.2",
    "pandas>=2.2",
    "pyarrow>=19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "respx>=0.21",
    "pytest-structlog>=1.0",
    "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
